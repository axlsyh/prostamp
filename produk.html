      { id:'shiny-N416',      category:'shiny-angka',                brand:'SHINY',  name:'Shiny Numberer N-416',               spec:'Tinggi angka: 4 mm · 16 digit',                                price:'Rp 235.000', image:'images/shiny-N416.jpg' },

      // BANTALAN / REPLACEMENT INK PAD TRODAT
      { id:'pad-trodat-6/4911', category:'trodat-inkpad',            brand:'TRODAT', name:'Replacement Pad Trodat 6/4911',      spec:'Untuk Trodat 4911 · 2 pcs/pack',                               price:'Rp 35.000',  image:'images/pad-trodat-4911.jpg' },
      { id:'pad-trodat-6/4913', category:'trodat-inkpad',            brand:'TRODAT', name:'Replacement Pad Trodat 6/4913',      spec:'Untuk Trodat 4913 · 2 pcs/pack',                               price:'Rp 40.000',  image:'images/pad-trodat-4913.jpg' },
      { id:'pad-trodat-6/4810', category:'trodat-inkpad',            brand:'TRODAT', name:'Replacement Pad Trodat 6/4810',      spec:'Untuk Trodat Dater 4810/4813/4817 · 2pcs',                     price:'Rp 45.000',  image:'images/pad-trodat-4810.jpg' },

      // BANTALAN / REPLACEMENT INK PAD SHINY
      { id:'pad-shiny-S842',    category:'shiny-inkpad',             brand:'SHINY',  name:'Replacement Pad Shiny S-842',        spec:'Untuk Shiny S-842/S-852/S-851 · 2pcs',                         price:'Rp 30.000',  image:'images/pad-shiny-S842.jpg' },
      { id:'pad-shiny-S843',    category:'shiny-inkpad',             brand:'SHINY',  name:'Replacement Pad Shiny S-843',        spec:'Untuk Shiny S-843/S-828 · 2 pcs/pack',                         price:'Rp 35.000',  image:'images/pad-shiny-S843.jpg' },
      { id:'pad-shiny-dater',   category:'shiny-inkpad',             brand:'SHINY',  name:'Replacement Pad Shiny Dater',        spec:'Untuk Shiny S-400/S-303/S-311 · 2pcs',                         price:'Rp 35.000',  image:'images/pad-shiny-dater.jpg' },

      // TINTA & BAK STEMPEL TRODAT
      { id:'tinta-trodat-7011-25', category:'trodat-tinta-bak',      brand:'TRODAT', name:'Tinta Trodat 7011 (25 ml)',           spec:'Untuk Trodat self-inking · Semua warna',                       price:'Rp 25.000',  image:'images/tinta-trodat-7011-25.jpg' },
      { id:'tinta-trodat-7011-28', category:'trodat-tinta-bak',      brand:'TRODAT', name:'Tinta Trodat 7011 (28 ml)',           spec:'Untuk Trodat self-inking · Semua warna',                       price:'Rp 28.000',  image:'images/tinta-trodat-7011-28.jpg' },

      // TINTA & BAK STEMPEL SHINY
      { id:'tinta-shiny',          category:'shiny-tinta-bak',       brand:'SHINY',  name:'Tinta Shiny Refill',                  spec:'Untuk Shiny self-inking · Semua warna',                        price:'Rp 22.000',  image:'images/tinta-shiny.jpg' },

      // TINTA PERMANEN
      { id:'tinta-tat-hitam',      category:'tinta-permanen',        brand:'TAT',    name:'Tinta Permanen TAT Shachihata (Hitam)', spec:'Tinta permanen waterproof · 50 ml',                        price:'Rp 55.000',  image:'images/tinta-tat-hitam.jpg' },
      { id:'tinta-tat-merah',      category:'tinta-permanen',        brand:'TAT',    name:'Tinta Permanen TAT Shachihata (Merah)', spec:'Tinta permanen waterproof · 50 ml',                        price:'Rp 55.000',  image:'images/tinta-tat-merah.jpg' },
    ];

    // ── STATE ─────────────────────────────────────────────────────────────────
    let activeCategory = 'all';

    // ── HELPERS ───────────────────────────────────────────────────────────────
    function getSearchQuery() {
      // Both inputs stay in sync; use whichever is visible / has value
      const desktop = document.getElementById('search-input').value.toLowerCase().trim();
      const mobile  = document.getElementById('search-input-mobile').value.toLowerCase().trim();
      return desktop || mobile;
    }

    function getFiltered() {
      const q = getSearchQuery();
      return products.filter(p => {
        let matchCat = activeCategory === 'all' || p.category === activeCategory;
        if (activeCategory === 'trodat') matchCat = p.brand === 'TRODAT';
        if (activeCategory === 'shiny')  matchCat = p.brand === 'SHINY';
        if (activeCategory === 'tinta')  matchCat = p.category.includes('tinta') || p.category.includes('inkpad');

        const matchSearch = !q ||
          p.name.toLowerCase().includes(q) ||
          p.spec.toLowerCase().includes(q) ||
          p.id.toLowerCase().includes(q);
        return matchCat && matchSearch;
      });
    }

    function cardHTML(p) {
      const badgeColor =
        p.brand === 'TRODAT' ? 'bg-red-100 text-red-700' :
        p.brand === 'SHINY'  ? 'bg-blue-100 text-blue-700' :
        p.brand === 'TAT'    ? 'bg-purple-100 text-purple-700' :
                               'bg-slate-100 text-slate-700';
      const waText = encodeURIComponent(
        'Halo Admin PRO Stamp, saya ingin pesan/tanya produk: ' + p.name
      );
      return `
        <div class="product-card bg-white rounded-xl border border-slate-200 overflow-hidden hover:shadow-md hover:border-slate-300 transition-all duration-200 flex flex-col">
          <div class="relative aspect-square bg-slate-100 flex items-center justify-center overflow-hidden">
            <span class="absolute top-2 left-2 z-10 text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm ${badgeColor}">${p.brand}</span>
            <img src="${p.image}" alt="${p.name}"
                 class="w-full h-full object-cover transition-transform duration-300 hover:scale-105"
                 loading="lazy"
                 onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <div style="display:none" class="flex flex-col items-center justify-center gap-2 w-full h-full text-slate-300 bg-slate-50">
              <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-3-3v6M4 7v10a1 1 0 001 1h14a1 1 0 001-1V7M4 7l1-2h14l1 2M4 7h16"/>
              </svg>
              <span class="text-xs text-slate-400">Foto segera hadir</span>
            </div>
          </div>
          <div class="p-3 sm:p-4 flex flex-col flex-1 gap-1">
            <h3 class="text-sm font-semibold text-slate-900 leading-tight">${p.name}</h3>
            <p class="text-xs text-slate-500 leading-relaxed">${p.spec}</p>
            <p class="text-sm font-bold text-blue-600 mt-auto pt-2">${p.price}</p>
            <a href="https://wa.me/6282114017009?text=${waText}"
               target="_blank" rel="noopener noreferrer"
               class="mt-1.5 w-full text-center text-xs font-semibold bg-green-500 hover:bg-green-600 active:bg-green-700 text-white py-2 rounded-lg transition-colors">
              Pesan via WhatsApp
            </a>
          </div>
        </div>`;
    }

    function render() {
      const grid  = document.getElementById('product-grid');
      const empty = document.getElementById('empty-state');
      const count = document.getElementById('result-count');
      const list  = getFiltered();

      if (list.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        count.textContent = '0 produk ditemukan';
        return;
      }

      empty.classList.add('hidden');
      grid.innerHTML = list.map(p => cardHTML(p)).join('');
      count.textContent = list.length + ' produk ditemukan';
    }

    function setCategory(catId) {
      activeCategory = catId;
      document.querySelectorAll('#sidebar-cats .cat-btn').forEach(btn => {
        if (btn.dataset.cat === catId) {
          btn.className = 'cat-btn w-full text-left text-xs sm:text-[13px] leading-snug px-3 py-2 rounded-lg font-semibold transition-colors bg-blue-600 text-white shadow-sm';
        } else {
          btn.className = 'cat-btn w-full text-left text-xs sm:text-[13px] leading-snug px-3 py-2 rounded-lg font-medium transition-colors text-slate-700 hover:bg-slate-100 hover:text-slate-900';
        }
      });
      document.querySelectorAll('#tab-cats .cat-btn').forEach(btn => {
        if (btn.dataset.cat === catId) {
          btn.className = 'cat-btn shrink-0 text-xs font-semibold px-3 py-1.5 rounded-full border transition-colors whitespace-nowrap bg-blue-600 text-white border-blue-600 shadow-sm';
        } else {
          btn.className = 'cat-btn shrink-0 text-xs font-semibold px-3 py-1.5 rounded-full border transition-colors whitespace-nowrap text-slate-700 hover:bg-slate-100 bg-white border-slate-200';
        }
      });
      render();
    }

    // ── RENDER CATEGORY BUTTONS ───────────────────────────────────────────────
    function buildCategoryButtons() {
      const sidebarEl = document.getElementById('sidebar-cats');
      const tabEl     = document.getElementById('tab-cats');

      categories.forEach(cat => {
        // ── Sidebar button ──
        const sBtn = document.createElement('button');
        sBtn.className = 'cat-btn w-full text-left text-xs sm:text-[13px] leading-snug px-3 py-2 rounded-lg font-medium transition-colors ' +
          (cat.id === 'all'
            ? 'bg-blue-600 text-white font-semibold shadow-sm'
            : 'text-slate-700 hover:bg-slate-100 hover:text-slate-900');
        sBtn.dataset.cat = cat.id;
        sBtn.textContent = cat.label;
        sBtn.addEventListener('click', () => setCategory(cat.id));
        sidebarEl.appendChild(sBtn);

        // ── Tab/pill button ──
        const tBtn = document.createElement('button');
        tBtn.className = 'cat-btn shrink-0 text-xs font-semibold px-3 py-1.5 rounded-full border transition-colors whitespace-nowrap ' +
          (cat.id === 'all'
            ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
            : 'text-slate-700 hover:bg-slate-100 bg-white border-slate-200');
        tBtn.dataset.cat = cat.id;
        tBtn.textContent = cat.label;
        tBtn.addEventListener('click', () => setCategory(cat.id));
        tabEl.appendChild(tBtn);
      });
    }

    // ── SEARCH EVENT LISTENERS ────────────────────────────────────────────────
    document.getElementById('search-input').addEventListener('input', function () {
      document.getElementById('search-input-mobile').value = this.value;
      render();
    });
    document.getElementById('search-input-mobile').addEventListener('input', function () {
      document.getElementById('search-input').value = this.value;
      render();
    });

    // ── INIT ──────────────────────────────────────────────────────────────────
    buildCategoryButtons();
    const urlParams = new URLSearchParams(window.location.search);
    const initialCat = urlParams.get('cat');
    if (initialCat) {
      setCategory(initialCat);
    } else {
      render();
    }
  </script>
</body>
</html>
